<!DOCTYPE html><html>
<head>
  <title>Soul_Ninja Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <style>
    body {
      background: linear-gradient(135deg, #000000, #1a1a1a);
      color: white;
      text-align: center;
      font-family: Arial;
      margin: 0;
      padding: 0;
    }

    h1 {
      background: red;
      padding: 15px;
      margin: 0;
      box-shadow: 0 0 15px red;
    }

    h2 {
      margin-top: 30px;
    }

    input, select {
      padding: 10px;
      margin: 10px;
      border-radius: 10px;
      border: none;
      width: 200px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border-radius: 10px;
      border: none;
      background: red;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 10px red;
      transition: 0.3s;
    }

    button:hover {
      background: darkred;
      transform: scale(1.05);
    }

    #welcome {
      font-size: 18px;
      color: lightgreen;
    }

    .box {
      border: 1px solid #333;
      margin: 20px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 10px #222;
    }
  </style></head><body>  <h1>🎮 BGMI PRO HUB</h1>  <p id="welcome"></p>  <!-- LOGIN -->  <div class="box">
    <h2>🔐 Login</h2>
    <input id="name" placeholder="Enter your name">
    <br>
    <button onclick="login()">Login</button>
  </div>  <!-- CALCULATOR -->  <div class="box">

    <input id="dpi" type="number" placeholder="Enter DPI">
    <br>
    <button onclick="calculate()">Calculate</button>
  </div>  <!-- SHOP -->  <div class="box">
    <h2>💰 UC Shop</h2><select id="uc">
  <option>60 UC - ₹75</option>
  <option>325 UC - ₹420</option>
  <option>660 UC - ₹800</option>
</select>
<br>

<button onclick="buy()">Buy Now</button>

  </div>  <script>
    function login() {
      var name = document.getElementById("name").value;

      if(name == "") {
        alert("Soul Ninja");
      } else {
        document.getElementById("welcome").innerHTML = "Welcome " + Soul Ninja + " 👋";
      }
    }

    function calculate() {
      var dpi = document.getElementById("dpi").value;

      if(dpi == "600 × 0.4 = 240") {
    alert ("600 × 0.4 = 240")
      } else {
        var result = (dpi * 0.4).toFixed(2);
        alert("Recommended Sensitivity: " + result);
      }
    }

    function buy() {
      var uc = document.getElementById("uc").value;
      alert("You selected: " + uc + "\\nWhatsApp pe contact kar 💬");
    }
  </script></body>
 </html>
